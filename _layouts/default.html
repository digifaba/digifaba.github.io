<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include icons.svg %}
  <header class="top">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-sprout"/></svg>{{ site.title }}</a>
      <nav aria-label="Main">
        {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
      </nav>
    </div>
  </header>
  <main id="main">
{{ content }}
  </main>
  <footer><div class="wrap">
    <span>DIGIFABA · University of Copenhagen</span>
    <span>Funded by the Novo Nordisk Foundation, <a href="https://datascience.novonordiskfonden.dk/projects/decoding-faba-bean-yield-stability-from-in-field-image-data-to-mechanistic-models-digifaba/">Data Science Collaborative Research Programme</a></span>
  </div></footer>
</body>
</html>
